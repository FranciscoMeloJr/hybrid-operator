apiVersion: v1
kind: ServiceAccount
metadata:
  name: hybrid-intelligent-operator-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hybrid-intelligent-operator-role-{{ .Release.Namespace }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hybrid-intelligent-operator-binding-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: hybrid-intelligent-operator-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: hybrid-intelligent-operator-role-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io