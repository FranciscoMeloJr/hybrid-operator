apiVersion: v1
kind: Secret
metadata:
  name: console-hybrid-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  ADMIN_PASS: {{ .Values.secrets.adminPass | quote }}
  FLASK_SECRET: {{ .Values.secrets.flaskSecret | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-hybrid-app
  namespace: {{ .Release.Namespace }}
  labels:
    app: console-hybrid-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: console-hybrid-app
  template:
    metadata:
      labels:
        app: console-hybrid-app
    spec:
      serviceAccountName: hybrid-intelligent-operator-sa
      {{- if .Values.targetNode }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - {{ .Values.targetNode }}
      {{- end }}
      containers:
        - name: go-operator
          image: {{ .Values.registry }}/{{ .Release.Namespace }}/hybrid-operator:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
        - name: web-dashboard
          image: {{ .Values.registry }}/{{ .Release.Namespace }}/dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.dashboard.port }}
              name: http
          env:
            - name: GO_INVENTORY_URL
              value: "http://127.0.0.1:8080/api/v1/inventory"
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: console-hybrid-secrets
                  key: ADMIN_PASS
            - name: FLASK_SECRET
              valueFrom:
                secretKeyRef:
                  name: console-hybrid-secrets
                  key: FLASK_SECRET
            # Build/version metadata injected at deploy time (deploy-helm.sh passes
            # release.gitSha / release.buildTime via --set). Surfaced at /version
            # and in the UI header so the running deployment is traceable to source.
            - name: APP_VERSION
              value: {{ (.Values.release | default dict).version | default "1.8.0-beta" | quote }}
            - name: APP_GIT_SHA
              value: {{ (.Values.release | default dict).gitSha | default "unknown" | quote }}
            - name: APP_BUILD_TIME
              value: {{ (.Values.release | default dict).buildTime | default "unknown" | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi