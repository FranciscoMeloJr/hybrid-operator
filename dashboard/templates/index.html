<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hybrid Operator Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-950 text-gray-200 antialiased min-h-screen p-6">

  <header class="border-b border-gray-800 pb-4 mb-6 flex justify-between items-center">
    <!-- Title & Logo Section -->
    <div class="flex items-center gap-4">
      <img src="/static/logo.png" alt="Apotheosis Logo" class="h-12 w-auto object-contain">
      <div>
        <h1 class="text-2xl font-bold text-white">OLM Governance Console</h1>
        <p class="text-sm text-gray-400">Powered by Flask & Hybrid Operator Sensor</p>
      </div>
    </div>
    
    <!-- Action Buttons Section -->
    <div class="flex items-center gap-3">
      <button onclick="downloadReport()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded shadow transition text-sm font-medium flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        Export Report
      </button>
      <a href="/features" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded shadow transition text-sm font-medium">
        Features
      </a>
      <a href="/help" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded shadow transition text-sm font-medium">
        Help
      </a>
      <button onclick="fetchTargets()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded shadow transition text-sm font-medium">
        Refresh Data
      </button>
    </div>
  </header>

  <!-- High-Level Metrics Summary Dashboard -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="summaryDashboard">
    <div class="bg-gray-900 border border-gray-800 p-4 rounded-lg shadow">
      <div class="text-xs font-semibold uppercase text-gray-400">Total Operators</div>
      <div class="text-3xl font-bold text-white mt-1" id="metricTotal">0</div>
      <div class="text-xs text-gray-500 mt-1">Discovered on cluster</div>
    </div>
    <div class="bg-gray-900 border border-gray-800 p-4 rounded-lg shadow">
      <div class="text-xs font-semibold uppercase text-emerald-400">Up To Date</div>
      <div class="text-3xl font-bold text-emerald-400 mt-1" id="metricUpToDate">0</div>
      <div class="text-xs text-gray-500 mt-1">On latest channel head</div>
    </div>
    <div class="bg-gray-900 border border-gray-800 p-4 rounded-lg shadow">
      <div class="text-xs font-semibold uppercase text-amber-400">Updates Pending</div>
      <div class="text-3xl font-bold text-amber-400 mt-1" id="metricUpgradeable">0</div>
      <div class="text-xs text-gray-500 mt-1">Newer CSV available</div>
    </div>
    <div class="bg-gray-900 border border-gray-800 p-4 rounded-lg shadow">
      <div class="text-xs font-semibold uppercase text-red-400">Major Upgrades</div>
      <div class="text-3xl font-bold text-red-400 mt-1" id="metricMajorRisk">0</div>
      <div class="text-xs text-gray-500 mt-1">Schema change risk</div>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-4" id="operatorGrid">
    <div class="text-center text-gray-500 py-10">Waiting for Operator Telemetry...</div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
